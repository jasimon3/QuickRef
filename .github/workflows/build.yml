name: Build QuickRef portable exe

# Runs on GitHub's own Windows machine — not yours. It has Node.js and internet access already, so
# this sidesteps every local constraint (no admin rights needed, no Node.js install needed).
on:
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: quickref-app
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Build installer and portable exe
        run: npm run dist

      # Both are produced so you can directly compare startup time — the installer (once installed)
      # never re-extracts on launch, while the portable exe self-extracts every single time it runs.
      # If the installer opens dramatically faster, that confirms self-extraction overhead (very
      # plausibly worsened by antivirus scanning every extracted file) as the real cause.
      - name: Upload both builds
        uses: actions/upload-artifact@v4
        with:
          name: QuickRef-builds
          path: |
            quickref-app/release/QuickRef-Setup.exe
            quickref-app/release/QuickRef-portable.exe
