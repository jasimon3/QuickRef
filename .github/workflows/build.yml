name: Build QuickRef portable exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: quickref-app
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Build portable exe
        run: npm run dist

      - name: Upload the portable exe
        uses: actions/upload-artifact@v4
        with:
          name: QuickRef-portable
          path: quickref-app/release/QuickRef-portable.exe
